<!-- Toast Messages Container for Dynamic Feedback -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1090;">
    {% if messages %}
        {% for message in messages %}
            <div class="toast align-items-center {% if message.tags == 'error' %}bg-danger text-white{% elif message.tags == 'success' %}bg-dark text-white{% else %}bg-secondary text-white{% endif %} border-0 shadow-lg mb-2 show" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        {{ message }}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
            </div>
        {% endfor %}
    {% endif %}
</div>
